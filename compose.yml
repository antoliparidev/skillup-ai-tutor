services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: skillup
      POSTGRES_PASSWORD: skillup
      POSTGRES_DB: skillup
    ports:
      - "127.0.0.1:5433:5432" # 5433 sul PC: la 5432 può essere già occupata
    volumes:
      - dati:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillup -d skillup"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dati: